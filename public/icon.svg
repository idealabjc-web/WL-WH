<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Badge ID / QR Icon element -->
  <g transform="translate(106, 106)">
    <!-- QR Corner Brackets -->
    <path d="M 0 60 L 0 10 A 10 10 0 0 1 10 0 L 60 0" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 240 0 L 290 0 A 10 10 0 0 1 300 10 L 300 60" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 0 240 L 0 290 A 10 10 0 0 0 10 300 L 60 300" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 240 300 L 290 300 A 10 10 0 0 0 300 290 L 300 240" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    <!-- Speaker Avatar icon in center -->
    <circle cx="150" cy="115" r="48" fill="#f8fafc"/>
    <path d="M 75 235 C 75 190, 110 175, 150 175 C 190 175, 225 190, 225 235 Z" fill="#f8fafc"/>
    <!-- Checkmark Badge -->
    <circle cx="225" cy="85" r="28" fill="#0d9488"/>
    <path d="M 213 85 L 222 94 L 238 76" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
