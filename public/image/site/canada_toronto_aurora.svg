    <rect x="780" y="370" width="76" height="245"/><rect x="880" y="325" width="86" height="290"/>
    <rect x="990" y="425" width="78" height="190"/><rect x="1095" y="385" width="72" height="230"/>
    <rect x="1200" y="455" width="82" height="160"/><rect x="1310" y="410" width="70" height="205"/>
