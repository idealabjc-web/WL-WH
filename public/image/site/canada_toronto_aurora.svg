<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="caSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b16"/>
      <stop offset="50%" stop-color="#0b1a2e"/>
      <stop offset="100%" stop-color="#2b0c18"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="crimsonGlow" cx="25%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#e5484d" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#050b16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#caSky)"/>
  <path d="M 120 260 Q 480 90 880 230 T 1520 140 L 1520 380 Q 1120 280 780 390 T 120 420 Z" fill="url(#aurora1)"/>
  <rect width="1600" height="900" fill="url(#crimsonGlow)"/>
  <!-- Toronto Financial Skyline & CN Tower -->
